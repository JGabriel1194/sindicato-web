<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@media (max-width:880px){
  .r-nav-toggle{display:flex!important}
  .r-nav-links{
    display:none!important;
    position:absolute;
    top:100%;
    left:0;
    right:0;
    flex-direction:column!important;
    align-items:flex-start!important;
    gap:2px!important;
    background:#fff;
    padding:10px 24px 20px;
    box-shadow:0 16px 30px rgba(7,39,22,.14);
    border-top:1px solid rgba(12,58,34,.08);
  }
  .r-nav-links.open{display:flex!important}
  .r-nav-links a{width:100%;padding:12px 2px!important}
  .r-hide-mobile{display:none!important}
}
</style>
</helmet>
<div style="font-family:'Public Sans',system-ui,sans-serif">

  <!-- FIXED HEADER + UTILITY BAR -->
  <div style="position:fixed;top:0;left:0;right:0;z-index:50">

    <!-- UTILITY BAR (collapses on scroll, header rises to take its place) -->
    <div style="{{ utilityStyle }}background:#0c3a22;color:#e7f2ea;font-size:13px">
      <div ref="{{ utilityRef }}" style="max-width:1180px;margin:0 auto;padding:9px 24px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between">
        <div style="display:flex;flex-wrap:wrap;gap:22px;align-items:center">
          <span style="display:flex;align-items:center;gap:7px"><span style="width:6px;height:6px;border-radius:50%;background:#ffcf33"></span>(06) 297-7420 - 0981907709</span>
          <span style="display:flex;align-items:center;gap:7px;opacity:.85">info@sindicatoespejo.com.ec</span>
          <span class="r-hide-mobile" style="display:flex;align-items:center;gap:7px;opacity:.85">Lun–Vie 08:00–17:00</span>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="r-hide-mobile" style="opacity:.7;margin-right:2px">Síguenos</span>
          <sc-for list="{{ socials }}" as="soc" hint-placeholder-count="4">
            <a href="{{ soc.l }}" style="width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font:700 11px Archivo,sans-serif;text-decoration:none;color:#fff">{{ soc.i }}</a>
          </sc-for>
        </div>
      </div>
    </div>

    <header ref="{{ headerRef }}" style="background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid rgba(12,58,34,.1)">
      <div style="max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px;position:relative">
        <a href="index.html#inicio" onClick="{{ closeMobile }}" style="display:flex;align-items:center;gap:12px;text-decoration:none">
          <img src="assets/img/logo.jpeg" style="width:60px;height:60px;border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(20,129,67,.28)" />
          <span style="display:flex;flex-direction:column;line-height:1.12">
            <span style="font:800 15px Archivo,sans-serif;color:#0c3a22;letter-spacing:-.01em">Sindicato de Choferes</span>
            <span style="font-size:11px;color:#5c6b62;letter-spacing:.04em;text-transform:uppercase">Profesionales del Cantón Espejo</span>
          </span>
        </a>

        <button class="r-nav-toggle" onClick="{{ toggleMobile }}" aria-label="Abrir menú" aria-expanded="{{ mobileOpen }}" style="display:none;flex:none;width:44px;height:44px;border-radius:10px;border:1px solid rgba(12,58,34,.15);background:#fff;color:#0c3a22;font-size:19px;cursor:pointer;align-items:center;justify-content:center">{{ toggleIcon }}</button>

        <nav class="{{ navLinksClass }}" style="display:flex;align-items:center;gap:26px">
          <sc-for list="{{ links }}" as="lk" hint-placeholder-count="6">
            <a href="{{ lk.href }}" onClick="{{ closeMobile }}" style="{{ lk.style }}">{{ lk.label }}</a>
          </sc-for>
          <a href="index.html#contacto" onClick="{{ closeMobile }}" style="display:inline-flex;align-items:center;gap:8px;background:#148143;color:#fff;font-weight:700;font-size:15px;text-decoration:none;padding:11px 22px;border-radius:10px;box-shadow:0 4px 12px rgba(20,129,67,.28)">Inscríbete</a>
        </nav>
      </div>
    </header>
  </div>

  <!-- SPACER: reserves the height the fixed block above takes up -->
  <div style="{{ spacerStyle }}"></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;&quot;,&quot;options&quot;:[&quot;&quot;,&quot;inicio&quot;,&quot;nosotros&quot;,&quot;licencias&quot;,&quot;proceso&quot;,&quot;instalaciones&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mobileOpen: false, scrolled: false, headerH: 89, utilityH: 40 };
  headerRef = React.createRef();
  utilityRef = React.createRef();

  componentDidMount(){
    this._onScroll = () => {
      const sc = window.scrollY > 8;
      if(sc !== this.state.scrolled) this.setState({ scrolled: sc });
    };
    this._onResize = () => this.measure();
    window.addEventListener('scroll', this._onScroll, { passive:true });
    window.addEventListener('resize', this._onResize);
    this._onScroll();
    this.measure();
    // fonts/images can still shift layout slightly after first paint
    setTimeout(()=>this.measure(), 300);
  }
  componentWillUnmount(){
    window.removeEventListener('scroll', this._onScroll);
    window.removeEventListener('resize', this._onResize);
  }
  measure(){
    const h = this.headerRef.current && this.headerRef.current.offsetHeight;
    const u = this.utilityRef.current && this.utilityRef.current.offsetHeight;
    const next = {};
    if(h && h !== this.state.headerH) next.headerH = h;
    if(u && u !== this.state.utilityH) next.utilityH = u;
    if(Object.keys(next).length) this.setState(next);
  }

  toggleMobile(){ this.setState(s=>({ mobileOpen: !s.mobileOpen })); }
  closeMobile(){ if(this.state.mobileOpen) this.setState({ mobileOpen:false }); }

  renderVals(){
    const active = this.props.active || '';
    const base = 'font-size:15px;font-weight:600;text-decoration:none;padding:6px 2px;border-bottom:2px solid transparent';
    const items = [
      { key:'inicio', label:'Inicio', href:'index.html#inicio' },
      { key:'nosotros', label:'Nosotros', href:'index.html#nosotros' },
      { key:'licencias', label:'Licencias', href:'index.html#licencias' },
      { key:'proceso', label:'Proceso', href:'index.html#proceso' },
      { key:'instalaciones', label:'Instalaciones', href:'index.html#instalaciones' },
    ];
    const s = this.state;
    const spacerH = s.scrolled ? s.headerH : (s.headerH + s.utilityH);
    return {
      socials: [ {i:'f', l:'https://www.facebook.com/SindicatoDeConductoresProfesionalesDeEspejo'}, {i:'tk',l:'https://www.tiktok.com/@sindicato.choferesespejo'}],
      year: new Date().getFullYear(),
      links: items.map(it=>({
        label: it.label, href: it.href,
        style: it.key===active
          ? `${base};color:#148143;border-bottom-color:#ffcf33`
          : `${base};color:#2c3d33`
      })),
      mobileOpen: this.state.mobileOpen,
      navLinksClass: 'r-nav-links' + (this.state.mobileOpen ? ' open' : ''),
      toggleIcon: this.state.mobileOpen ? '✕' : '☰',
      toggleMobile: ()=>this.toggleMobile(),
      closeMobile: ()=>this.closeMobile(),
      headerRef: this.headerRef,
      utilityRef: this.utilityRef,
      spacerStyle: `height:${spacerH}px;transition:height .28s ease`,
      utilityStyle: s.scrolled
        ? 'overflow:hidden;transition:max-height .28s ease,opacity .2s ease;max-height:0px;opacity:0;'
        : 'overflow:hidden;transition:max-height .28s ease,opacity .25s ease;max-height:80px;opacity:1;',
    };
  }
}
</script>
</body>
</html>
